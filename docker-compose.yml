services:
  # Production application
  my-profile:
    build:
      context: ./my-profile
      dockerfile: Dockerfile
      target: runner
    container_name: my-profile-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-profile_user}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-myprofile}}
      AUTH_SECRET: ${AUTH_SECRET:-portfolio-cms-super-secret-auth-key-2026-production-ready}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health?liveness=true || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network

  # Development application (profile: dev)
  my-profile-dev:
    build:
      context: ./my-profile
      dockerfile: Dockerfile
      target: dev
    container_name: my-profile-dev
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - ./my-profile:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-profile_user}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-myprofile}}
      AUTH_SECRET: ${AUTH_SECRET:-portfolio-cms-super-secret-auth-key-2026-production-ready}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - app_network

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: my-profile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myprofile}
      POSTGRES_USER: ${POSTGRES_USER:-profile_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      # Bound to localhost only to prevent accidental external database exposure
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profile_user} -d ${POSTGRES_DB:-myprofile}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
